<!doctype html>
<html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Таємниця лісового маяка — v0</title>
<style>
body{font-family:Arial,sans-serif;background:#10251f;color:#f3f0df;margin:0;min-height:100vh;display:grid;place-items:center}.panel{max-width:650px;margin:24px;padding:28px;background:#1d3a30;border:1px solid #6c8a70;border-radius:16px;text-align:center}h1{color:#f5d98b}.symbols{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:24px 0}button{font-size:20px;padding:18px 20px;border-radius:12px;border:2px solid #c5d3a5;background:#e8edda;cursor:pointer}#status{min-height:48px;font-size:18px}
</style><body><main class="panel"><h1>Таємниця лісового маяка</h1><p>Активуй три символи у правильному порядку.</p><p>Порядок: листок → крапля → зірка.</p><div class="symbols"><button data-s="leaf">🍃 Листок</button><button data-s="drop">💧 Крапля</button><button data-s="star">⭐ Зірка</button></div><p id="status" aria-live="polite">Механізм очікує на дію.</p></main>
<script>
const answer=["leaf","drop","star"];let step=0,done=false;
document.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{if(done)return;const s=b.dataset.s;if(s===answer[step]){step++;document.querySelector("#status").textContent="Правильно. Кроків виконано: "+step+"/3";if(step===3){done=true;document.querySelector("#status").textContent="Маяк запалено! Прохід відкрито.";}}else{step=0;document.querySelector("#status").textContent="Помилка. Послідовність скинуто.";}}));
</script></body></html>
